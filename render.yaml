services:
  - type: web
    name: youtube-thumbnail-generator
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
    disk:
      name: outputs
      mountPath: /opt/render/project/src/outputs
      sizeGB: 1
